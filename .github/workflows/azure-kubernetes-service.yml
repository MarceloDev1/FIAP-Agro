name: Build and deploy FIAP.Agro to AKS

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  K8S_NAMESPACE: "fiap-agro"

  DEPLOYMENT_MANIFESTS: |
    k8s/00-namespace.yaml
    k8s/01-sqlserver.yaml
    k8s/02-rabbitmq.yaml
    k8s/03-jwt-secret.yaml
    k8s/10-identity.yaml
    k8s/11-property.yaml
    k8s/12-ingestion.yaml
    k8s/13-alertapi.yaml
    k8s/14-alertworker.yaml

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Show Azure account
        run: |
          az account show -o table
          az acr show -n ${{ secrets.ACR_NAME }} -g ${{ secrets.RESOURCE_GROUP }} -o table

      - name: ACR login (docker)
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build and push identity image
        run: |
          docker build \
            -f FIAP.Agro.Identity/Dockerfile \
            -t ${{ secrets.ACR_NAME }}.azurecr.io/fiap-agro/identity:${{ github.sha }} \
            -t ${{ secrets.ACR_NAME }}.azurecr.io/fiap-agro/identity:latest \
            .
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/fiap-agro/identity:${{ github.sha }}
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/fiap-agro/identity:latest

      - name: Build and push property image
        run: |
          docker build \
            -f FIAP.Agro.Property/Dockerfile \
            -t ${{ secrets.ACR_NAME }}.azurecr.io/fiap-agro/property:${{ github.sha }} \
            -t ${{ secrets.ACR_NAME }}.azurecr.io/fiap-agro/property:latest \
            .
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/fiap-agro/property:${{ github.sha }}
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/fiap-agro/property:latest

      - name: Build and push ingestion image
        run: |
          docker build \
            -f FIAP.Agro.Ingestion/Dockerfile \
            -t ${{ secrets.ACR_NAME }}.azurecr.io/fiap-agro/ingestion:${{ github.sha }} \
            -t ${{ secrets.ACR_NAME }}.azurecr.io/fiap-agro/ingestion:latest \
            .
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/fiap-agro/ingestion:${{ github.sha }}
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/fiap-agro/ingestion:latest

      - name: Build and push alert-api image
        run: |
          docker build \
            -f FIAP.Agro.Alert/Dockerfile \
            -t ${{ secrets.ACR_NAME }}.azurecr.io/fiap-agro/alert-api:${{ github.sha }} \
            -t ${{ secrets.ACR_NAME }}.azurecr.io/fiap-agro/alert-api:latest \
            .
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/fiap-agro/alert-api:${{ github.sha }}
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/fiap-agro/alert-api:latest

      - name: Build and push alert-worker image
        run: |
          docker build \
            -f AlertWorker/Dockerfile \
            -t ${{ secrets.ACR_NAME }}.azurecr.io/fiap-agro/alert-worker:${{ github.sha }} \
            -t ${{ secrets.ACR_NAME }}.azurecr.io/fiap-agro/alert-worker:latest \
            .
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/fiap-agro/alert-worker:${{ github.sha }}
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/fiap-agro/alert-worker:latest

      - name: Set up kubelogin
        uses: azure/use-kubelogin@v1
        with:
          kubelogin-version: "v0.0.25"

      - name: Get AKS context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ secrets.RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}
          admin: "false"
          use-kubelogin: "true"

      - name: Substitute image names in manifests
        run: |
          ACR="${{ secrets.ACR_NAME }}.azurecr.io"
          SHA="${{ github.sha }}"
          sed -i "s|image: fiap-agro/identity:1.0|image: ${ACR}/fiap-agro/identity:${SHA}|g" k8s/10-identity.yaml
          sed -i "s|image: fiap-agro/property:1.0|image: ${ACR}/fiap-agro/property:${SHA}|g" k8s/11-property.yaml
          sed -i "s|image: fiap-agro/ingestion:1.0|image: ${ACR}/fiap-agro/ingestion:${SHA}|g" k8s/12-ingestion.yaml
          sed -i "s|image: fiap-agro/alert-api:1.0|image: ${ACR}/fiap-agro/alert-api:${SHA}|g" k8s/13-alertapi.yaml
          sed -i "s|image: fiap-agro/alert-worker:1.0|image: ${ACR}/fiap-agro/alert-worker:${SHA}|g" k8s/14-alertworker.yaml
          echo "=== Imagens depois da substituicao ==="
          grep -h "image:" k8s/10-identity.yaml k8s/11-property.yaml k8s/12-ingestion.yaml k8s/13-alertapi.yaml k8s/14-alertworker.yaml

      - name: Validate Kubernetes manifests
        run: |
          echo "Validating manifests..."
          while IFS= read -r manifest; do
            [ -z "$manifest" ] && continue
            echo "Validating: $manifest"
            kubectl apply --dry-run=client -f "$manifest" -n ${{ env.K8S_NAMESPACE }} || {
              echo "Validation failed for: $manifest"
              exit 1
            }
          done <<< "${{ env.DEPLOYMENT_MANIFESTS }}"
          echo "All manifests validated"

      - name: Deploy manifests to AKS
        uses: Azure/k8s-deploy@v4
        with:
          action: deploy
          namespace: ${{ env.K8S_NAMESPACE }}
          manifests: ${{ env.DEPLOYMENT_MANIFESTS }}

      - name: Verify deployment status
        run: |
          echo "Resources in namespace ${{ env.K8S_NAMESPACE }}:"
          kubectl get all -n ${{ env.K8S_NAMESPACE }}

          echo "Waiting for deployments to be ready..."
          kubectl rollout status deployment/identity-api      -n ${{ env.K8S_NAMESPACE }} --timeout=5m
          kubectl rollout status deployment/property-api      -n ${{ env.K8S_NAMESPACE }} --timeout=5m
          kubectl rollout status deployment/ingestion-api     -n ${{ env.K8S_NAMESPACE }} --timeout=5m
          kubectl rollout status deployment/alert-api         -n ${{ env.K8S_NAMESPACE }} --timeout=5m
          kubectl rollout status deployment/alert-worker      -n ${{ env.K8S_NAMESPACE }} --timeout=5m

          echo "Final pod status:"
          kubectl get pods -n ${{ env.K8S_NAMESPACE }} -o wide

      - name: Azure logout
        if: always()
        run: |
          az logout
          az cache purge

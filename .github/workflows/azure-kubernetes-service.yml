name: Build and deploy FIAP.Agro to AKS

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  K8S_NAMESPACE: "fiap-agro"

  DEPLOYMENT_MANIFESTS: |
    k8s/00-namespace.yaml
    k8s/01-sqlserver.yaml
    k8s/02-rabbitmq.yaml
    k8s/03-jwt-secret.yaml
    k8s/10-identity.yaml
    k8s/11-property.yaml
    k8s/12-ingestion.yaml
    k8s/13-alertapi.yaml
    k8s/14-alertworker.yaml

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Show Azure account
        run: |
          az account show -o table
          az acr show -n ${{ secrets.ACR_NAME }} -g ${{ secrets.RESOURCE_GROUP }} -o table

      - name: Build identity image
        run: |
          az acr build \
            --image fiap-agro/identity:${{ github.sha }} \
            --image fiap-agro/identity:latest \
            --registry ${{ secrets.ACR_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --file FIAP.Agro.Identity/Dockerfile \
            .

      - name: Build property image
        run: |
          az acr build \
            --image fiap-agro/property:${{ github.sha }} \
            --image fiap-agro/property:latest \
            --registry ${{ secrets.ACR_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --file FIAP.Agro.Property/Dockerfile \
            .

      - name: Build ingestion image
        run: |
          az acr build \
            --image fiap-agro/ingestion:${{ github.sha }} \
            --image fiap-agro/ingestion:latest \
            --registry ${{ secrets.ACR_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --file FIAP.Agro.Ingestion/Dockerfile \
            .

      - name: Build alert-api image
        run: |
          az acr build \
            --image fiap-agro/alert-api:${{ github.sha }} \
            --image fiap-agro/alert-api:latest \
            --registry ${{ secrets.ACR_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --file FIAP.Agro.Alert/Dockerfile \
            .

      - name: Build alert-worker image
        run: |
          az acr build \
            --image fiap-agro/alert-worker:${{ github.sha }} \
            --image fiap-agro/alert-worker:latest \
            --registry ${{ secrets.ACR_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --file AlertWorker/Dockerfile \
            .

      - name: Set up kubelogin
        uses: azure/use-kubelogin@v1
        with:
          kubelogin-version: "v0.0.25"

      - name: Get AKS context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ secrets.RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}
          admin: "false"
          use-kubelogin: "true"

      - name: Validate Kubernetes manifests
        run: |
          echo "Validating manifests..."
          while IFS= read -r manifest; do
            [ -z "$manifest" ] && continue
            echo "Validating: $manifest"
            kubectl apply --dry-run=client -f "$manifest" -n ${{ env.K8S_NAMESPACE }} || {
              echo "Validation failed for: $manifest"
              exit 1
            }
          done <<< "${{ env.DEPLOYMENT_MANIFESTS }}"
          echo "All manifests validated"

      - name: Deploy manifests to AKS
        uses: Azure/k8s-deploy@v4
        with:
          action: deploy
          namespace: ${{ env.K8S_NAMESPACE }}
          manifests: ${{ env.DEPLOYMENT_MANIFESTS }}
          images: |
            ${{ secrets.ACR_NAME }}.azurecr.io/fiap-agro/identity:${{ github.sha }}
            ${{ secrets.ACR_NAME }}.azurecr.io/fiap-agro/property:${{ github.sha }}
            ${{ secrets.ACR_NAME }}.azurecr.io/fiap-agro/ingestion:${{ github.sha }}
            ${{ secrets.ACR_NAME }}.azurecr.io/fiap-agro/alert-api:${{ github.sha }}
            ${{ secrets.ACR_NAME }}.azurecr.io/fiap-agro/alert-worker:${{ github.sha }}

      - name: Verify deployment status
        run: |
          echo "Resources in namespace ${{ env.K8S_NAMESPACE }}:"
          kubectl get all -n ${{ env.K8S_NAMESPACE }}

          echo "Waiting for deployments to be ready..."
          kubectl rollout status deployment/identity-api      -n ${{ env.K8S_NAMESPACE }} --timeout=5m
          kubectl rollout status deployment/property-api      -n ${{ env.K8S_NAMESPACE }} --timeout=5m
          kubectl rollout status deployment/ingestion-api     -n ${{ env.K8S_NAMESPACE }} --timeout=5m
          kubectl rollout status deployment/alert-api         -n ${{ env.K8S_NAMESPACE }} --timeout=5m
          kubectl rollout status deployment/alert-worker      -n ${{ env.K8S_NAMESPACE }} --timeout=5m

          echo "Final pod status:"
          kubectl get pods -n ${{ env.K8S_NAMESPACE }} -o wide

      - name: Azure logout
        if: always()
        run: |
          az logout
          az cache purge
